services:
  - type: web
    name: course-enrollment-platform-api
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: course-enrollment-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: course-enrollment-platform-db
    plan: free
